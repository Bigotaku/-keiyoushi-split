name: Split & Sync Repositories

on:
  schedule:
    - cron: '0 0,12 * * *'  # Runs automatically at 00:00 and 12:00 UTC
  workflow_dispatch:        # Button to manually run it whenever you want

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Protoc & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          pip install protobuf

      - name: Compile Protobuf & Run Splitter
        run: |
          protoc --python_out=. repo.proto
          python split_repo.py

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
