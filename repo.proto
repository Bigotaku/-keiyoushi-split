syntax = "proto3";

message Source {
  string name = 1;
  string lang = 2;
  string id = 3;
  string baseUrl = 4;
}

message Extension {
  string name = 1;
  string pkg = 2;
  string apk = 3;
  string lang = 4;
  int64 code = 5;
  string version = 6;
  int32 nsfw = 7;
  int32 hasReadme = 8;
  int32 hasChangelog = 9;
  repeated Source sources = 10;
}

message ExtensionList {
  repeated Extension extensions = 1;
}
